<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serie Phantom</title>
    <link rel="icon" type="image/x-icon" href="Phantom%20Web_archivos/star.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }
        
        .proteccion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
        }
        
        .contenedor {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        
        .imagen-principal {
            position: relative;
            z-index: 2;
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            
            opacity: 0;
            transform: translateY(100px);
            animation: subirSuave 2s ease-out forwards;
            
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
            
            /* Añadir transición para cambio suave */
            transition: opacity 0.5s ease;
        }
        
        .canvas-container {
            position: relative;
            z-index: 2;
            max-width: 90%;
            max-height: 80%;
            display: none;
            object-fit: contain;
        }
        
        .canvas-protegido {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        
        @keyframes subirSuave {
            0% {
                opacity: 0;
                transform: translateY(100px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .imagen-principal,
            .canvas-protegido {
                max-width: 95%;
                max-height: 70%;
            }
        }
        
        @media (min-width: 1200px) {
            .imagen-principal,
            .canvas-protegido {
                max-width: 80%;
                max-height: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="proteccion-overlay" id="proteccionOverlay"></div>
    
    <div class="contenedor">
        <img src="Phantom%20Web_archivos/imagen-fondo-serie.jpg" alt="Fondo Phantom" class="fondo" id="fondoImg">
        
        <img src="Phantom%20Web_archivos/Imagen-1-de-la-serie-phantom.png" alt="Phantom Serie 1" class="imagen-principal" id="imagenPrincipal">
        
        <div class="canvas-container" id="canvasContainer"></div>
    </div>

    <script>
        
        function activarProteccionTotal() {
            console.log('🔒 Activando protección total...');
            
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                mostrarMensajeProteccion();
                return false;
            });
            
            
            document.addEventListener('dragstart', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    mostrarMensajeProteccion();
                    return false;
                }
            });
            
         
            document.addEventListener('keydown', function(e) {
            
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    mostrarMensajeProteccion();
                    return false;
                }
             
                if (e.ctrlKey && e.key === 'c') {
                    e.preventDefault();
                    mostrarMensajeProteccion();
                    return false;
                }
          
                if (e.ctrlKey && e.key === 'p') {
                    e.preventDefault();
                    mostrarMensajeProteccion();
                    return false;
                }
              
                if (e.key === 'PrintScreen') {
                    e.preventDefault();
                    mostrarMensajeProteccion();
                    return false;
                }
            
                if (e.key === 'F12') {
                    e.preventDefault();
                    mostrarMensajeProteccion();
                    return false;
                }
            });
            
           
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            });
            
          
            document.addEventListener('copy', function(e) {
                e.preventDefault();
                mostrarMensajeProteccion();
                return false;
            });
            
            function convertirImagenACanvas() {
                const imagenPrincipal = document.getElementById('imagenPrincipal');
                const canvasContainer = document.getElementById('canvasContainer');
                
                if (imagenPrincipal.complete && !canvasContainer.hasChildNodes()) {
                    console.log('🔄 Convirtiendo imagen a canvas...');
                    
                    // Obtener las dimensiones VISIBLES de la imagen
                    const displayWidth = imagenPrincipal.clientWidth;
                    const displayHeight = imagenPrincipal.clientHeight;
                    const displayStyle = window.getComputedStyle(imagenPrincipal);
                    
                    // Crear canvas
                    const canvas = document.createElement('canvas');
                    canvas.className = 'canvas-protegido';
                    
                    // IMPORTANTE: Usar las mismas dimensiones que la imagen visible
                    canvas.width = displayWidth;
                    canvas.height = displayHeight;
                    
                    const ctx = canvas.getContext('2d');
                    
                    // Configurar el contexto para mantener calidad
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    
                    // Dibujar la imagen en el canvas con las dimensiones correctas
                    ctx.drawImage(imagenPrincipal, 0, 0, displayWidth, displayHeight);
                    
                    // Aplicar estilos similares a la imagen original
                    canvas.style.opacity = '1';
                    canvas.style.transform = 'translateY(0)';
                    
                    // Primero hacer fade out de la imagen
                    imagenPrincipal.style.opacity = '0';
                    
                    // Esperar a que termine el fade out, luego mostrar el canvas
                    setTimeout(() => {
                        canvasContainer.appendChild(canvas);
                        canvasContainer.style.display = 'block';
                        imagenPrincipal.style.display = 'none';
                        
                        console.log('✅ Imagen convertida a canvas (protegida)');
                        console.log(`Dimensiones canvas: ${canvas.width}x${canvas.height}`);
                        console.log(`Dimensiones originales imagen: ${imagenPrincipal.naturalWidth}x${imagenPrincipal.naturalHeight}`);
                    }, 500);
                } else {
                    // Si no está lista, reintentar en 100ms
                    setTimeout(convertirImagenACanvas, 100);
                }
            }
            
           
            window.addEventListener('load', function() {
                // Esperar un poco más para asegurar que todo esté cargado
                setTimeout(() => {
                    // Esperar a que termine la animación de entrada
                    setTimeout(convertirImagenACanvas, 2000);
                }, 500);
            });
            
            // Si la imagen ya está cargada cuando se ejecuta el script
            if (document.getElementById('imagenPrincipal').complete) {
                setTimeout(convertirImagenACanvas, 2500);
            } else {
                // Si no está cargada, esperar a que cargue
                document.getElementById('imagenPrincipal').addEventListener('load', function() {
                    setTimeout(convertirImagenACanvas, 2500);
                });
            }
         
            function detectarDevTools() {
                const threshold = 160;
                const widthThreshold = window.outerWidth - window.innerWidth > threshold;
                const heightThreshold = window.outerHeight - window.innerHeight > threshold;
                
                if (widthThreshold || heightThreshold) {
                    document.body.innerHTML = `
                        <div style="
                            position: fixed;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            background: black;
                            color: red;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            font-family: Arial;
                            text-align: center;
                            z-index: 10000;
                        ">
                            <div>
                                <h1>⚠️ ACCESO BLOQUEADO</h1>
                                <p>No se permiten herramientas de desarrollo</p>
                                <p>Esta página contiene contenido protegido</p>
                            </div>
                        </div>
                    `;
                }
            }
            
            setInterval(detectarDevTools, 1000);
            
            console.log('✅ Protección total activada');
        }
        
        function mostrarMensajeProteccion() {
            const mensaje = document.createElement('div');
            mensaje.textContent = '⚠️ Contenido protegido';
            mensaje.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(255, 0, 0, 0.9);
                color: white;
                padding: 10px 15px;
                font-family: Arial, sans-serif;
                font-size: 14px;
                border-radius: 5px;
                z-index: 10000;
                animation: fadeProtection 1.5s forwards;
                pointer-events: none;
            `;
            
       
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeProtection {
                    0% { opacity: 0; transform: translateX(50px); }
                    20% { opacity: 1; transform: translateX(0); }
                    80% { opacity: 1; transform: translateX(0); }
                    100% { opacity: 0; transform: translateX(50px); }
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(mensaje);
            setTimeout(() => {
                if (mensaje.parentNode) {
                    mensaje.parentNode.removeChild(mensaje);
                }
            }, 1500);
        }
        
 
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=')) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
        
 
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎬 Serie Phantom - Cargando...');
            
            // Asegurar que el contenedor tenga el tamaño correcto
            document.documentElement.style.width = '100vw';
            document.documentElement.style.height = '100vh';
            document.body.style.overflow = 'hidden';
            
            // Activar protección
            activarProteccionTotal();
            
            console.log('✅ Página cargada - Imagen protegida');
        });
        
       
        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
