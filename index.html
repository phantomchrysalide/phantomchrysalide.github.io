<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom Series</title>
    <style>
        /* RESET SIMPLE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* OCUPAR TODO SIN MÁRGENES */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }
        
        /* CONTENEDOR CENTRADO */
        .contenedor {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* FONDO - OCUPA TODO */
        .fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* IMAGEN PNG - ANIMACIÓN LIMPIA */
        .imagen-principal {
            position: relative;
            z-index: 2;
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            
            /* ANIMACIÓN SIMPLE: solo sube desde abajo */
            opacity: 0;
            transform: translateY(100px);
            animation: subirSuave 2s ease-out forwards;
        }
        
        /* ANIMACIÓN SUPER SIMPLE - SOLO SUBIR */
        @keyframes subirSuave {
            0% {
                opacity: 0;
                transform: translateY(100px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* RESPONSIVE BÁSICO */
        @media (max-width: 768px) {
            .imagen-principal {
                max-width: 95%;
                max-height: 70%;
            }
        }
        
        @media (min-width: 1200px) {
            .imagen-principal {
                max-width: 80%;
                max-height: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <!-- FONDO -->
        <img src="Phantom%20Web_archivos/imagen-fondo-serie.jpg" 
             alt="Fondo Phantom" 
             class="fondo">
        
        <!-- IMAGEN PNG - SUBE DESDE ABAJO -->
        <img src="Phantom%20Web_archivos/Imagen-1-de-la-serie-phantom.png" 
             alt="Phantom Serie 1" 
             class="imagen-principal">
    </div>

    <script>
        // BLOQUEAR CLIC DERECHO SIMPLE
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // BLOQUEAR ZOOM CON TECLADO
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=')) {
                e.preventDefault();
            }
        });
        
        // BLOQUEAR ZOOM TÁCTIL
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        // BLOQUEAR DOUBLE-TAP ZOOM EN MÓVILES
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
        
        // CONFIRMAR CARGA
        window.addEventListener('load', function() {
            console.log('✅ Página cargada - Imagen subiendo desde abajo');
        });
    </script>
</body>
</html>
