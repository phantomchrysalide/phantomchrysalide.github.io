<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom Chrysalide</title>
    
    <!-- Fuente Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&amp;display=swap" rel="stylesheet">
    
    <style>
        /* Reset y bloqueo de zoom/scroll */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Special Gothic Expanded One', sans-serif;
            color: #ffffff;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* Contenedor principal - pantalla completa */
        .contenedor-pantalla {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            padding: 10px;
        }

        /* Texto superior - MUCHO MÁS PEQUEÑO */
        .texto-entrada {
            font-family: 'Special Gothic Expanded One', sans-serif;
            font-size: 16px; /* Más pequeño */
            text-align: center;
            color: #ffffff;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 10px; /* Menos espacio */
            flex-shrink: 0;
            height: auto;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
            opacity: 1;
        }

        /* Contenedor del GIF - MÁS GRANDE y central */
        .contenedor-gif {
            flex: 1;
            width: 100%;
            max-width: 95vw;
            height: 60vh; /* MÁS ALTO */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0;
            border: 5px solid #000000;
            overflow: hidden;
            flex-shrink: 0;
        }

        .gif-grande {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene proporción */
            image-rendering: crisp-edges;
            pointer-events: none;
            max-width: 100%;
            max-height: 100%;
        }

        /* Contenedor de estrella - MUCHO MÁS PEQUEÑO */
        .estrella-contenedor {
            flex-shrink: 0;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        /* Estrella - MUCHO MÁS PEQUEÑA */
        .estrella-brillante {
            width: 60px; /* Mucho más pequeña */
            height: 60px;
            animation: girar 30s linear infinite, pulsar-luz 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
            flex-shrink: 0;
        }

        .estrella-brillante:hover {
            transform: scale(1.05); /* Menos crecimiento */
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
        }

        /* SVG de la estrella */
        .estrella-svg {
            width: 100%;
            height: 100%;
        }

        /* Copyright - MÁS PEQUEÑO */
        .copyright {
            font-family: 'Special Gothic Expanded One', sans-serif;
            font-size: 12px; /* Más pequeño */
            text-align: center;
            color: #ffffff;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-top: 5px;
            flex-shrink: 0;
            height: auto;
            opacity: 1;
        }

        /* Animaciones */
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulsar-luz {
            0%, 100% {
                opacity: 0.7;
                filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.3));
            }
            50% {
                opacity: 0.9;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            }
        }

        /* Media queries para adaptación */
        @media (orientation: portrait) {
            .contenedor-gif {
                height: 65vh; /* Aún más alto en vertical */
                max-width: 98vw;
            }
            
            .texto-entrada {
                font-size: 14px;
                margin-bottom: 8px;
            }
            
            .estrella-brillante {
                width: 50px;
                height: 50px;
            }
            
            .copyright {
                font-size: 11px;
            }
        }

        @media (max-height: 600px) {
            .contenedor-gif {
                height: 55vh;
            }
            
            .texto-entrada {
                font-size: 13px;
            }
            
            .estrella-brillante {
                width: 45px;
                height: 45px;
            }
            
            .copyright {
                font-size: 10px;
            }
        }

        /* Para pantallas muy pequeñas */
        @media (max-width: 480px) {
            .contenedor-pantalla {
                padding: 5px;
            }
            
            .contenedor-gif {
                height: 60vh;
                border-width: 3px;
                margin: 3px 0;
            }
            
            .texto-entrada {
                font-size: 12px;
                margin-bottom: 5px;
            }
            
            .estrella-brillante {
                width: 40px;
                height: 40px;
            }
            
            .copyright {
                font-size: 9px;
            }
        }

        /* Para pantallas grandes */
        @media (min-width: 1200px) and (min-height: 800px) {
            .contenedor-gif {
                height: 70vh;
                max-width: 90vw;
            }
            
            .texto-entrada {
                font-size: 18px;
            }
            
            .estrella-brillante {
                width: 70px;
                height: 70px;
            }
            
            .copyright {
                font-size: 14px;
            }
        }
    </style>
    
    <script>
        // Deshabilitar clic derecho y zoom
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);
        
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=' || e.keyCode === 187 || e.keyCode === 189)) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
        
        // Forzar bucle del GIF
        function mantenerGifAnimado() {
            const gif = document.querySelector('.gif-grande');
            if (gif && gif.src) {
                const gifSrc = gif.src.split('?')[0];
                
                function reiniciarGif() {
                    if (gif.complete) {
                        gif.src = gifSrc + '?t=' + Date.now();
                    }
                }
                
                if (gifSrc.toLowerCase().endsWith('.gif')) {
                    setInterval(reiniciarGif, 3000);
                }
            }
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            mantenerGifAnimado();
        });
    </script>
</head>

<body>
    <div class="contenedor-pantalla">
        <!-- Texto superior - pequeño -->
        
        
        <!-- GIF - MÁS GRANDE y central -->
        <div class="contenedor-gif">
            <img src="Phantom%20Web_archivos/PHANTOM-1.gif" alt="Phantom Chrysalide" class="gif-grande">
        </div>
        
        <!-- Estrella - pequeña -->
        <div class="estrella-contenedor">
            <a href="https://www.amazon.es/Phantom-Chrysalide-Ren-Bonet-ebook/dp/B0CXYJ72MZ" class="estrella-brillante" target="_blank" style="text-decoration: none;">
               
                <svg class="estrella-svg" viewBox="0 0 200 200">
                    <defs>
                        <!-- Gradiente para el punto central -->
                        <radialGradient id="centroGradiente" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"></stop>
                            <stop offset="70%" stop-color="rgba(255, 255, 255, 0.8)" stop-opacity="0.8"></stop>
                            <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" stop-opacity="0"></stop>
                        </radialGradient>
                        
                        <!-- Gradiente para halos -->
                        <radialGradient id="haloGradiente" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="rgba(255, 255, 255, 0)" stop-opacity="0"></stop>
                            <stop offset="50%" stop-color="rgba(255, 255, 255, 0.3)" stop-opacity="0.3"></stop>
                            <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" stop-opacity="0"></stop>
                        </radialGradient>
                        
                        <!-- Filtro de brillo suave -->
                        <filter id="glowSuave">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"></feGaussianBlur>
                            <feFlood flood-color="#ffffff" flood-opacity="0.4" result="color"></feFlood>
                            <feComposite in="color" in2="blur" operator="in" result="coloredBlur"></feComposite>
                            <feMerge>
                                <feMergeNode in="coloredBlur"></feMergeNode>
                                <feMergeNode in="SourceGraphic"></feMergeNode>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Halo externo -->
                    <circle cx="100" cy="100" r="85" fill="url(#haloGradiente)" opacity="0.2">
                        <animate attributeName="opacity" values="0.2;0.3;0.2" dur="3s" repeatCount="indefinite"></animate>
                    </circle>
                    
                    <!-- Halo medio -->
                    <circle cx="100" cy="100" r="70" fill="url(#haloGradiente)" opacity="0.25">
                        <animate attributeName="opacity" values="0.25;0.35;0.25" dur="2.5s" repeatCount="indefinite"></animate>
                    </circle>
                    
                    <!-- Halo interno -->
                    <circle cx="100" cy="100" r="55" fill="url(#haloGradiente)" opacity="0.3">
                        <animate attributeName="opacity" values="0.3;0.4;0.3" dur="2s" repeatCount="indefinite"></animate>
                    </circle>
                    
                    <!-- Anillos concéntricos - más sutiles -->
                    <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.8"></circle>
                    <circle cx="100" cy="100" r="65" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.7"></circle>
                    <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.6"></circle>
                    <circle cx="100" cy="100" r="35" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.5"></circle>
                    
                    <!-- Punto central -->
                    <circle cx="100" cy="100" r="10" fill="url(#centroGradiente)" filter="url(#glowSuave)" opacity="0.8">
                        <animate attributeName="r" values="10;11;10" dur="2s" repeatCount="indefinite"></animate>
                    </circle>
                    
                    <!-- Núcleo central -->
                    <circle cx="100" cy="100" r="4" fill="#ffffff" opacity="0.9">
                        <animate attributeName="r" values="4;4.5;4" dur="1s" repeatCount="indefinite"></animate>
                    </circle>
                    
                    <!-- Partículas pequeñas - menos visibles -->
                    <circle cx="130" cy="100" r="1" fill="#ffffff" opacity="0.4">
                        <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2s" repeatCount="indefinite"></animate>
                    </circle>
                    <circle cx="70" cy="100" r="1" fill="#ffffff" opacity="0.4">
                        <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2s" repeatCount="indefinite"></animate>
                    </circle>
                </svg>
            </a>
            
            <!-- Copyright - pequeño -->
            <div class="copyright">REN BONET © 2026</div>
        </div>
    </div>

</body></html>
