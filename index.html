<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serie Phantom</title>
    <link rel="icon" type="image/x-icon" href="Phantom%20Web_archivos/star.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }
        
        .contenedor {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }
        
        .fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }
        
        .imagen-principal {
            position: relative;
            z-index: 2;
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            opacity: 0;
            transform: translateY(100px);
            animation: subirSuave 2s ease-out forwards;
            pointer-events: auto;
            transition: opacity 0.5s ease;
        }
        
        .canvas-container {
            position: absolute;
            z-index: 2;
            max-width: 90%;
            max-height: 80%;
            width: auto;
            height: auto;
            display: none;
        }
        
        .canvas-protegido {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            opacity: 1;
        }
        
        @keyframes subirSuave {
            0% {
                opacity: 0;
                transform: translateY(100px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .imagen-principal,
            .canvas-container {
                max-width: 95%;
                max-height: 70%;
            }
        }
        
        @media (min-width: 1200px) {
            .imagen-principal,
            .canvas-container {
                max-width: 80%;
                max-height: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor" id="contenedor">
        <img src="Phantom%20Web_archivos/imagen-fondo-serie.jpg" alt="Fondo Phantom" class="fondo" id="fondoImg">
        <img src="Phantom%20Web_archivos/Imagen-1-de-la-serie-phantom.png" alt="Phantom Serie 1" class="imagen-principal" id="imagenPrincipal">
        <div class="canvas-container" id="canvasContainer"></div>
    </div>

    <script>
        // Variable para controlar si ya se convirtió a canvas
        let canvasConvertido = false;
        
        // Función para proteger la imagen convirtiéndola a canvas
        function convertirImagenACanvas() {
            if (canvasConvertido) return;
            
            const imagenPrincipal = document.getElementById('imagenPrincipal');
            const canvasContainer = document.getElementById('canvasContainer');
            
            if (!imagenPrincipal.complete) {
                setTimeout(convertirImagenACanvas, 100);
                return;
            }
            
            // Crear canvas
            const canvas = document.createElement('canvas');
            canvas.className = 'canvas-protegido';
            
            // Obtener dimensiones actuales de la imagen visible
            const displayRect = imagenPrincipal.getBoundingClientRect();
            
            // Crear canvas con las mismas dimensiones visibles
            canvas.width = displayRect.width;
            canvas.height = displayRect.height;
            
            const ctx = canvas.getContext('2d');
            
            // Configurar calidad
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            
            // Dibujar la imagen escalada al tamaño del canvas
            ctx.drawImage(imagenPrincipal, 0, 0, displayRect.width, displayRect.height);
            
            // Ocultar imagen original y mostrar canvas
            imagenPrincipal.style.opacity = '0';
            
            setTimeout(() => {
                canvasContainer.appendChild(canvas);
                canvasContainer.style.display = 'block';
                imagenPrincipal.style.display = 'none';
                canvasConvertido = true;
                
                console.log('✅ Imagen protegida en canvas');
            }, 500);
        }
        
        // Función para abrir enlace al hacer clic
        function configurarClic() {
            const contenedor = document.getElementById('contenedor');
            
            contenedor.addEventListener('click', function() {
                console.log('🌍 Abriendo enlace de Amazon...');
                window.open('https://www.amazon.es/dp/B0CY97WQ2L?binding=kindle_edition&ref=dbs_dp_rwt_sb_pc_tkin', '_blank');
            });
        }
        
        // Protección básica
        function activarProteccion() {
            // Prevenir clic derecho
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Prevenir arrastrar imágenes
            document.addEventListener('dragstart', function(e) {
                if (e.target.tagName === 'IMG' || e.target.tagName === 'CANVAS') {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Prevenir atajos de teclado comunes
            document.addEventListener('keydown', function(e) {
                // Prevenir F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
                if (e.key === 'F12' || 
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
                    (e.ctrlKey && e.key === 'u')) {
                    e.preventDefault();
                    return false;
                }
                
                // Prevenir capturas de pantalla
                if (e.key === 'PrintScreen') {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Prevenir zoom con Ctrl+rueda
            document.addEventListener('wheel', function(e) {
                if (e.ctrlKey) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevenir zoom táctil
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            });
        }
        
        // Inicializar todo cuando cargue la página
        window.addEventListener('load', function() {
            console.log('🎬 Serie Phantom - Cargando...');
            
            // Activar protección básica
            activarProteccion();
            
            // Configurar clic para abrir enlace
            configurarClic();
            
            // Convertir imagen a canvas después de la animación
            setTimeout(() => {
                convertirImagenACanvas();
            }, 2000);
            
            console.log('✅ Página lista');
        });
        
        // Si la imagen ya está cargada
        document.getElementById('imagenPrincipal').addEventListener('load', function() {
            console.log('🖼️ Imagen principal cargada');
        });
    </script>
</body>
</html>
